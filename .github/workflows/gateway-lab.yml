name: Real isolated gateway lab preflight
on:
  push:
    branches: [engineering-audit]
permissions:
  contents: read
jobs:
  gateway-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated lab dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 curl openssl
      - name: Run actual routed traffic and kernel lease tests
        run: sudo python3 Tests/integration/gateway_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-lab-results
          path: build/gateway-lab-results.json
          if-no-files-found: error
