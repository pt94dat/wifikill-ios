name: Build native ARM64 and publish validated APT repository
on:
  push:
    branches: [main, engineering-audit, phase4-engine, phase5-identity, fix/dns-intermediate-negative-20261128, reference-reuse]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gateway-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated lab dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 curl openssl dnsmasq-base udhcpc
      - name: Run real routed IPv4 and IPv6 control and crash-recovery checks
        run: sudo python3 Tests/integration/gateway_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-gateway-lab-results
          path: build/gateway-lab-results.json
          if-no-files-found: error
  native-reference:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify reused SimplePing with actual unprivileged host loopback
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -I Sources -framework Foundation -framework CoreServices Tests/host_probe_native_tests.m Sources/Network/LGHostProbe.m Sources/ThirdParty/SimplePing.m -o "$RUNNER_TEMP/host-probe-tests"
          "$RUNNER_TEMP/host-probe-tests"
      - name: Verify private enrollment file decoding
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources -framework Foundation Tests/enrollment_native_tests.m Sources/RouterManagement/LGEnrollment.m Sources/RouterManagement/LGEndpoint.m -o "$RUNNER_TEMP/enrollment-tests"
          "$RUNNER_TEMP/enrollment-tests"
  build:
    needs: [gateway-lab, native-reference]
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: brew install make dpkg ldid
      - name: Set up pinned Theos with Apple-provided Xcode SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/download-artifact@v4
        with:
          name: isolated-gateway-lab-results
          path: build
      - name: Test native device state reducer
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources -framework Foundation Tests/model_tests.m Sources/Devices/LGDevice.m -o "$RUNNER_TEMP/model-tests"
          "$RUNNER_TEMP/model-tests"
      - name: Test native network snapshots and sanitized diagnostics
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources -framework Foundation Tests/network_model_tests.m Sources/Network/LGAuthorizedInventory.m Sources/Network/LGScanSnapshot.m Sources/Network/LGBonjourInventory.m Sources/Network/LGServiceEvidence.m Sources/Network/LGIdentity.c Sources/Devices/LGDevice.m Sources/Diagnostics/LGDiagnostics.m -o "$RUNNER_TEMP/network-model-tests"
          "$RUNNER_TEMP/network-model-tests"
      - name: Test actual staged scan pipeline with owned synthetic transports
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources -framework Foundation Tests/scan_pipeline_tests.m Sources/Network/LGScanner.m Sources/Network/LGScanSnapshot.m Sources/Network/LGServiceEvidence.m Sources/Network/LGIdentity.c Sources/Devices/LGDevice.m -o "$RUNNER_TEMP/scan-pipeline-tests"
          "$RUNNER_TEMP/scan-pipeline-tests"
      - name: Compare Bonjour collection windows against an owned host advertisement
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -I Sources -framework Foundation Tests/bonjour_native_tests.m Sources/Network/LGBonjourInventory.m Sources/Network/LGServiceEvidence.m Sources/Network/LGIdentity.c Sources/Devices/LGDevice.m -o "$RUNNER_TEMP/bonjour-native-tests"
          "$RUNNER_TEMP/bonjour-native-tests"
      - name: Verify real host DNS-SD against a controlled local-only PTR record
        run: |
          xcrun clang -Wall -Wextra -Werror -I Sources Tests/resolver_native_tests.c Sources/Network/LGResolver.c Sources/Network/LGDNSCheck.c Sources/Network/LGIdentity.c -o "$RUNNER_TEMP/resolver-native-tests"
          "$RUNNER_TEMP/resolver-native-tests"
      - name: Test gateway and portable identity logic
        run: python3 -m unittest discover -s Tests -v
      - name: Build and ldid-sign native app
        run: |
          python3 - <<'PYINFO'
          import os, plistlib
          from pathlib import Path
          p=Path('Resources/Info.plist')
          info=plistlib.loads(p.read_bytes());info['LGSourceCommit']=os.environ['GITHUB_SHA'];p.write_bytes(plistlib.dumps(info))
          PYINFO
          gmake clean package
      - uses: actions/download-artifact@v4
        with:
          name: isolated-gateway-lab-results
          path: build
      - name: Preserve published releases
        run: python3 Scripts/retain_release.py
      - name: Validate package and generate repository
        run: |
          python3 Scripts/build_repository.py
          python3 Scripts/verify_repository.py build/repository
      - uses: actions/upload-artifact@v4
        with:
          name: native-debian-package
          path: packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/repository
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify published HTTPS repository
        env:
          EXPECTED_VERSION: 0.6.0-beta.1
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 Scripts/verify_repository.py https://pt94dat.github.io/wifikill-ios/
